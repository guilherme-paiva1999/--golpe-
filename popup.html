<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>É Golpe?</title>
<style>
  body{width:340px;margin:0;font:15px/1.45 Arial,Helvetica,sans-serif;color:#10201c;background:#fff}
  header{padding:14px 16px;background:#0b6e5b;color:#fff;font-weight:bold;font-size:17px}
  section{padding:14px 16px;border-bottom:1px solid #d3dcd8;display:flex;flex-direction:column;gap:10px}
  #pill{padding:10px;border-radius:8px;font-weight:bold;font-size:18px;text-align:center;background:#e9eeeb}
  #pill.ok{background:#e3f3e9;color:#17803f}#pill.atencao{background:#fbf0d8;color:#8a5a07}#pill.perigo{background:#fbe4e1;color:#b42323}
  ul{margin:0;padding-left:20px;font-size:14px}
  label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
  select,button{font:14px Arial,sans-serif;padding:6px 8px}
  small{color:#586964}
</style>
</head>
<body>
<header>É Golpe?</header>
<section>
  <div id="pill">Analisando…</div>
  <div id="host"><small></small></div>
  <ul id="motivos"></ul>
</section>
<section>
  <label for="limite">Sensibilidade nos posts</label>
  <select id="limite">
    <option value="3">Normal (só sinais fortes)</option>
    <option value="2">Mais proteção</option>
    <option value="1">Máxima</option>
  </select>
  <label for="rigor">Rigor dos avisos</label>
  <select id="rigor">
    <option value="alto">Alto: todo site é suspeito até provar o contrário</option>
    <option value="normal">Normal: só avisa com sinais mais fortes</option>
  </select>
  <label for="simples"><input type="checkbox" id="simples"> Modo simples<br><small>Avisos com letras bem grandes, só o essencial e botão para ouvir.</small></label>
  <label for="idade"><input type="checkbox" id="idade"> Consultar a idade do site em qualquer página<br><small>Envia o domínio ao rdap.org. Desligado, só consulta quando já há suspeita.</small></label>
  <label for="imagens"><input type="checkbox" id="imagens"> Verificar imagens feitas por IA<br><small>Pede permissão para baixar o início das imagens.</small></label>
</section>
<section>
  <label>Ajude o É Golpe? a aprender</label>
  <button id="btnGolpe" type="button">É golpe</button>
  <button id="btnSeguro" type="button">É seguro</button>
  <button id="btnBaixar" type="button">Baixar meus dados (para treinar)</button>
  <small id="rotulosInfo">Seus cliques ficam só neste computador.</small>
</section>
<section>
  <label>Testar os avisos nesta página</label>
  <button id="demoAtencao" type="button">Aviso de atenção</button>
  <button id="demoPerigo" type="button">Aviso de perigo</button>
  <button id="demoPagamento" type="button">Aviso de pagamento</button>
  <button id="demoBloqueio" type="button">Tela de bloqueio</button>
  <small>Só para ver como ficam. Use "Modo simples" acima para comparar.</small>
</section>
<section>
  <button id="atualizar" type="button">Atualizar listas de golpes agora</button>
  <small id="quando"></small>
</section>
<script src="popup.js"></script>
</body>
</html>
