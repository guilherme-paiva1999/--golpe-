# Publica o aplicativo (a tela "Verificar um link") no GitHub Pages.
# Roda sozinho a cada envio para a main que mude a pasta da extensão, ou à mão em Actions › Run workflow.
# Endereço: https://guilherme-paiva1999.github.io/--golpe-/
# Só vão os arquivos do aplicativo. As páginas de teste (teste/) ficam de fora de propósito:
# elas imitam logins falsos (gov.br, Microsoft) e, num site público, poderiam ser marcadas como golpe.
name: Publicar aplicativo

on:
  push:
    branches: [main]
    paths: ['1-extensao-codigo/**', '.github/workflows/publicar-aplicativo.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Separar os arquivos do aplicativo
        run: |
          set -e
          cd 1-extensao-codigo
          mkdir -p ../_site/ml ../_site/dados ../_site/icons ../_site/icones
          cp index.html verificar.html verificar.css verificar.js ponte.js manifest.webmanifest app-sw.js \
             background.js alfabetos.js modelo.js pessoa.js ../_site/
          cp ml/modelo.json ../_site/ml/
          cp dados/consumidor.json ../_site/dados/
          cp icons/reclameaqui.png ../_site/icons/
          cp icones/*.png ../_site/icones/
          touch ../_site/.nojekyll
          ls -R ../_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
